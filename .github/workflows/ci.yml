name: Validate BatchBeacon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-${{ runner.os }}-4.0.4
      - name: Create disposable local secrets
        run: dart scripts/setup.dart
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install pinned Serverpod generator
        run: |
          dart install serverpod_cli@4.0.4
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"
      - name: Regenerate typed protocol
        working-directory: batchbeacon_server
        run: serverpod generate
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed batchbeacon_server/lib batchbeacon_server/bin batchbeacon_server/test batchbeacon_client/bin batchbeacon_flutter/lib batchbeacon_flutter/test scripts/setup.dart
      - name: Analyze server
        working-directory: batchbeacon_server
        run: dart analyze --fatal-infos
      - name: Analyze client
        working-directory: batchbeacon_client
        run: dart analyze --fatal-infos
      - name: Analyze Flutter
        working-directory: batchbeacon_flutter
        run: flutter analyze --no-pub --fatal-infos
      - name: PostgreSQL and domain tests
        working-directory: batchbeacon_server
        run: dart test --reporter expanded
      - name: Flutter widget tests
        working-directory: batchbeacon_flutter
        run: flutter test --no-pub
      - name: Build web release
        working-directory: batchbeacon_flutter
        run: flutter build web --release --no-pub
