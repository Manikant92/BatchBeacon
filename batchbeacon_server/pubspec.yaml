name: batchbeacon_server
description: Serverpod backend for BatchBeacon hospital supply coordination.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage: 4.0.4

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.25.5

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows copies release assets with the PowerShell helper.
    # POSIX builds directly into the server's web directory.
    flutter_build:
      windows: >-
        powershell -NoProfile -ExecutionPolicy Bypass -File ..\scripts\build-web.ps1
      posix: |
        rm -rf ../batchbeacon_server/web/app
        cd ../batchbeacon_flutter
        set -- web --base-href / --output ../batchbeacon_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    batchbeacon:
      path: ../batchbeacon_flutter
      displayName: "Batchbeacon app"
      auto_launch: true
      target: lib/driver.dart
